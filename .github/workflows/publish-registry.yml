# Keeping the MCP registry listing from going stale.
#
# The registry entry sat at 0.4.1 through four npm releases, still telling
# anyone who found the server that way that it covered 15 email clients. There
# were 21. `server.json` in this repo was correct the whole time; nothing had
# ever pushed it.
#
# So the push is a workflow rather than a step in someone's head. It runs on a
# published GitHub release, on any push to main that changes server.json, once
# a day, and on demand. npm is published by hand, often after the push, so a
# version not on npm yet is skipped quietly and the daily run lists it once it
# is there. A version the registry already lists is skipped too, so the daily
# run is a no-op on most days. 0.13.1 was missed this way before (2026-10-28).
#
# npm publishing stays manual on purpose: this needs no secrets at all. The
# registry accepts GitHub OIDC for an `io.github.*` namespace, so there is no
# token to store, rotate, or leak.

name: Publish to MCP Registry

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths: [server.json]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: server.json to registry.modelcontextprotocol.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The registry only accepts a version that exists on npm, and it checks
      # that the published package's `mcpName` matches the name in server.json.
      # Failing here is cheaper than a rejected publish.
      - name: Check the version is on npm
        id: check
        run: |
          version=$(node -p "require('./server.json').packages[0].version")
          name=$(node -p "require('./server.json').packages[0].identifier")
          server=$(node -p "require('./server.json').name")
          echo "server.json wants $name@$version"
          listed=$(curl -fsS "https://registry.modelcontextprotocol.io/v0/servers/$(node -p "encodeURIComponent('$server')")/versions/latest" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).server.version)}catch{console.log("")}})' || true)
          if [ "$listed" = "$version" ]; then
            echo "The registry already lists $version; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          published=$(npm view "$name@$version" version 2>/dev/null || true)
          if [ "$published" != "$version" ]; then
            # A release or a manual run means it should be there: fail loudly.
            # A push or the daily run is often ahead of the npm publish.
            if [ "$GITHUB_EVENT_NAME" = "release" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              echo "::error::$name@$version is not on npm. Publish it first."
              exit 1
            fi
            echo "$name@$version is not on npm yet; the daily run will list it once it is."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mcp_name=$(npm view "$name@$version" mcpName 2>/dev/null || true)
          expected=$(node -p "require('./server.json').name")
          if [ "$mcp_name" != "$expected" ]; then
            echo "::error::published mcpName is '$mcp_name', server.json says '$expected'"
            exit 1
          fi
          # The registry caps the description at 100 characters and answers a
          # 422 over it, after the login and the download. The first run of
          # this workflow died there on a 139-character one.
          length=$(node -p "require('./server.json').description.length")
          if [ "$length" -gt 100 ]; then
            echo "::error::description is $length characters, the registry allows 100"
            exit 1
          fi

      - name: Install mcp-publisher
        if: steps.check.outputs.skip != 'true'
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate
        if: steps.check.outputs.skip != 'true'
        run: ./mcp-publisher login github-oidc

      - name: Publish
        if: steps.check.outputs.skip != 'true'
        run: ./mcp-publisher publish
