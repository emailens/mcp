name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # --frozen-lockfile so CI installs what a contributor's checkout does.
      # The other half of that question — what a *new* installer resolves once
      # a dependency publishes — is latest-engine.yml's job.
      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun test

      - run: bun run build
